<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Acquisto</title>
</head>
<body>
<form id="articolo">
    <h2>Aggiungi un articolo</h2>
    <label for="nome">Nome:</label>
    <input type="text" id="nome" name="nome" required><br><br>

    <label for="descrizione">Descrizione:</label>
    <textarea id="descrizione" name="descrizione" required></textarea><br><br>

    <label for="prezzo">Immagine:</label>
    <input type="file" id="immagine" name="immagine" accept="image/*" required><br><br>

    <label for="prezzo">Prezzo:</label>
    <input type="number" id="prezzo" name="prezzo" required><br><br>

    <button type="submit">Aggiungi Articolo</button>
</form>
<form id="asta">
    <h2>Seleziona gli articoli per l'asta</h2>
    <div id="listaArticoli">
        <!-- Qui verranno inseriti gli articoli dinamicamente via JS -->
    </div>
    <button type="submit">Crea Asta</button>
</form>
</body>
</html>
