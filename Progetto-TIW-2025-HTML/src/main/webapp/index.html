<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Index</title>
</head>
    <body>
        <form id="login" action="/Login" method="POST">
            <input type="text" name="username" placeholder="Nome" required><br><br>
            <input type="password" name="password" placeholder="Cognome" required><br><br>
            <button type="submit">Accedi</button>
        </form>

        <p th:text="${errorMsg}"></p>
        <p><a href="registrazione.html">Non hai un account? Vai alla registrazione</a></p>
    </body>
</html>
