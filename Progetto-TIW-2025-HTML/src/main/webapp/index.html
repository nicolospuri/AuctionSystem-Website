<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Index</title>
</head>
    <body>
        <h2>Login</h2>
        <form th:action="@{/Login}" method="POST">
            <input type="text" name="username" placeholder="Nome" required><br><br>
            <input type="password" name="password" placeholder="Cognome" required><br><br>
            <button type="submit">Accedi</button>
        </form>
        <div th:if="${errorMsg}">
            <span th:text="${errorMsg}"></span>
        </div>
        <p><a th:href="@{/registrazione}">Non hai un account? Vai alla registrazione</a></p>
    </body>
</html>
